[platformio]
default_envs = esp12e

[env:esp12e]
; This environment intentionally pins the original 2019 firmware stack so a
; clean checkout remains reproducible. SmartPod v2 will use a maintained,
; hardware-adapter architecture rather than extending this legacy toolchain.
platform = https://github.com/platformio/platform-espressif8266.git#cd6f5cc8500914b14a8f08364201867a8e9e2aaf
platform_packages =
  platformio/framework-arduinoespressif8266@2.20502.0
  platformio/toolchain-xtensa@1.40802.0
  platformio/tool-esptool@1.413.0
  platformio/tool-esptoolpy@1.20600.0
  platformio/tool-mkspiffs@1.200.0

board = esp12e
board_build.f_cpu = 160000000L
board_build.filesystem = spiffs
framework = arduino
monitor_speed = 115200

extra_scripts = pre:timelib_fix.py

build_flags =
  -D NO_GLOBAL_ARDUINOOTA
  ; Uncomment ENABLE_CORS for local React development only.
  ;-D ENABLE_CORS
  -D CORS_ORIGIN=\"http://localhost:3000\"

lib_deps =
  https://github.com/gmag11/NtpClient.git#446ff48805ba7adba17d2a8d25e6583b6f023940
  paulstoffregen/Time@1.6.1
  bblanchon/ArduinoJson@6.21.6
  zeed/ESP Async WebServer@1.2.3
  me-no-dev/ESPAsyncTCP@1.2.2
  adafruit/Adafruit Unified Sensor@1.1.15
  https://github.com/TiZeRa/ACS712-arduino.git#8d254d0ab4149a5c97dfb1ef27cda341348d8a1d
