name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: interface/package-lock.json

      - name: Install dashboard dependencies
        working-directory: interface
        run: npm ci

      - name: Test dashboard
        working-directory: interface
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      - name: Build dashboard
        working-directory: interface
        run: npm run build
        env:
          CI: "true"

      - name: Verify compressed dashboard bundle
        run: test -n "$(find data/www/js -type f -name '*.js.gz' -print -quit)"

      - name: Build hosted simulator
        working-directory: interface
        env:
          PUBLIC_URL: /SmartPod
          REACT_APP_DEMO_MODE: "true"
        run: npm run build:demo

      - name: Reject critical npm advisories
        working-directory: interface
        run: npm audit --audit-level=critical

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify GitHub-only CLI installer
        run: |
          sh -n install.sh
          shellcheck install.sh
          python -m unittest discover -s tests -p 'test_install.py' -v

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build ESP8266 firmware
        run: pio run -e esp12e

      - name: Build device filesystem
        run: pio run -e esp12e -t buildfs

      - name: Upload firmware images
        uses: actions/upload-artifact@v7
        with:
          name: smartpod-esp12e
          if-no-files-found: error
          path: |
            .pio/build/esp12e/firmware.bin
            .pio/build/esp12e/spiffs.bin
