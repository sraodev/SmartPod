openapi: 3.1.0
info:
  title: SmartPod Gateway API
  version: 0.1.0-draft
  license:
    name: GNU Lesser General Public License v3.0
    url: https://www.gnu.org/licenses/lgpl-3.0.html
  description: |
    Draft hardware-neutral contract for SmartPod v2. Commands express intent;
    responses and events report the controller's actual state.
    The browser lab is not a gateway. Its contract examples are simulated local
    estimates, not authoritative meter readings, receipts, or payment results.
    See simulator-contract.md for the explicit milli-Wh and state boundary.
    The local gateway preview implements only GET /v1/ports and GET /v1/ports/{portId}
    under /api, with bearer authentication and loopback-only HTTP. Its fixed replay
    is synthetic and not connected to the browser lab. Session commands and events
    remain unimplemented; see gateway.md for startup and security restrictions.
security:
  - bearerAuth: []
servers:
  - url: http://127.0.0.1:8080/api
    description: Implemented loopback-only simulator preview; GET port endpoints only
  - url: https://{host}/api
    description: Proposed secured control plane or site gateway (not implemented)
    variables:
      host:
        default: smartpod.local
        description: Deployment-specific API host
paths:
  /v1/ports:
    get:
      operationId: listPorts
      summary: List the ports visible to the caller
      responses:
        "200":
          description: Available ports
          content:
            application/json:
              schema:
                type: object
                required: [ports]
                properties:
                  ports:
                    type: array
                    items:
                      $ref: "#/components/schemas/Port"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/ports/{portId}:
    parameters:
      - $ref: "#/components/parameters/PortId"
    get:
      operationId: getPort
      summary: Get the current actual state of one port
      responses:
        "200":
          description: Current actual port state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Port"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions:
    post:
      operationId: startSession
      summary: Request an authorized session start
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [port_id, tariff_id]
              properties:
                port_id:
                  type: string
                tariff_id:
                  type: string
                payment_authorization_id:
                  type: [string, "null"]
                limits:
                  $ref: "#/components/schemas/SessionLimits"
      responses:
        "202":
          description: Start intent accepted; the controller may still reject it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          description: Port state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSession
      summary: Get session state, metering, and charge details
      responses:
        "200":
          description: Session state and authoritative running estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sessions/{sessionId}/stop:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: stopSession
      summary: Request a session stop
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Stop intent accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/events:
    get:
      operationId: streamEvents
      summary: Stream port, session, meter, payment, and fault updates
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PortId:
      name: portId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Forbidden:
      description: Host or browser-origin policy rejected the request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: Only GET is supported on implemented port endpoints
      headers:
        Allow:
          schema:
            type: string
            const: GET
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: Persistent simulator storage is unavailable; no in-memory fallback
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Port:
      type: object
      additionalProperties: false
      required: [id, mode, state, actual_output, measurement, faults, updated_at]
      examples:
        - id: lab-port-1
          mode: simulator
          state: available
          actual_output: open
          active_session_id: null
          measurement:
            sequence: 120
            voltage_mv: 230000
            current_ma: 0
            active_power_w: 0
            energy_wh: 500
            quality: estimated
            sampled_at: "2026-08-31T10:02:00Z"
          faults: []
          updated_at: "2026-08-31T10:02:00Z"
      properties:
        id:
          type: string
        mode:
          type: string
          enum: [simulator, smart-power, ac-evse]
        state:
          type: string
          enum: [unavailable, available, authorizing, preparing, energizing, active, stopping, faulted]
        actual_output:
          type: string
          enum: [open, closed, unknown]
          description: Explicit adapter feedback, never inferred from commands or session state. Missing or untrusted feedback is unknown; simulator feedback is synthetic, not physical evidence.
        measurement:
          $ref: "#/components/schemas/Measurement"
        faults:
          type: array
          items:
            $ref: "#/components/schemas/Fault"
        active_session_id:
          type: [string, "null"]
        updated_at:
          type: string
          format: date-time
    Measurement:
      type: object
      additionalProperties: false
      required: [sequence, voltage_mv, current_ma, active_power_w, energy_wh, quality, sampled_at]
      properties:
        sequence:
          type: integer
          minimum: 0
        voltage_mv:
          type: integer
          minimum: 0
        current_ma:
          type: integer
          minimum: 0
        active_power_w:
          type: integer
        energy_wh:
          type: integer
          minimum: 0
          description: Cumulative whole Wh in the adapter's meter epoch. The lab projects floor(energyMilliWh / 1000) from its session-relative counter, retaining the milli-Wh source and remainder locally; this estimate must not be used to reconstruct a bill. A future meter adapter must declare its epoch/reset behavior.
        quality:
          type: string
          enum: [measured, estimated, stale, invalid]
        sampled_at:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required: [id, port_id, state, tariff, start_energy_wh, charge, created_at]
      examples:
        - id: lab-session-1
          port_id: lab-port-1
          state: completed
          tariff:
            id: demo-inr-standard
            version: 1
            currency: INR
            fixed_minor: 500
            energy_per_kwh_minor: 1200
            time_per_minute_minor: 20
            idle_per_minute_minor: 0
            tax_basis_points: 1800
          start_energy_wh: 0
          end_energy_wh: 500
          charge:
            currency: INR
            fixed_minor: 500
            energy_minor: 601
            time_minor: 40
            idle_minor: 0
            tax_minor: 205
            total_minor: 1346
            estimated: true
          payment_state: not_required
          stop_reason: user_stop
          created_at: "2026-08-31T10:00:00Z"
          started_at: "2026-08-31T10:00:00Z"
          ended_at: "2026-08-31T10:02:00Z"
      properties:
        id:
          type: string
        port_id:
          type: string
        state:
          type: string
          enum: [authorizing, preparing, energizing, active, stopping, completed, settled, failed]
        tariff:
          $ref: "#/components/schemas/TariffSnapshot"
        limits:
          $ref: "#/components/schemas/SessionLimits"
        start_energy_wh:
          type: integer
          minimum: 0
          description: Start reading in the same meter epoch as the end reading. The lab counter starts at zero per session, unlike a physical lifetime meter.
        end_energy_wh:
          type: [integer, "null"]
          minimum: 0
        charge:
          $ref: "#/components/schemas/ChargeBreakdown"
        payment_state:
          type: string
          enum: [not_required, pending, authorized, captured, failed, refunded]
        stop_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
    SessionLimits:
      type: [object, "null"]
      additionalProperties: false
      properties:
        max_energy_wh:
          type: integer
          exclusiveMinimum: 0
        max_duration_seconds:
          type: integer
          exclusiveMinimum: 0
        max_amount_minor:
          type: integer
          exclusiveMinimum: 0
    TariffSnapshot:
      type: object
      additionalProperties: false
      required: [id, version, currency, fixed_minor, energy_per_kwh_minor, tax_basis_points]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        fixed_minor:
          type: integer
          minimum: 0
        energy_per_kwh_minor:
          type: integer
          minimum: 0
        time_per_minute_minor:
          type: integer
          minimum: 0
          default: 0
        idle_per_minute_minor:
          type: integer
          minimum: 0
          default: 0
        tax_basis_points:
          type: integer
          minimum: 0
    ChargeBreakdown:
      type: object
      additionalProperties: false
      required: [currency, fixed_minor, energy_minor, time_minor, idle_minor, tax_minor, total_minor, estimated]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        fixed_minor:
          type: integer
        energy_minor:
          type: integer
        time_minor:
          type: integer
        idle_minor:
          type: integer
        tax_minor:
          type: integer
        total_minor:
          type: integer
        estimated:
          type: boolean
          description: Always true for browser-lab examples. A local simulator estimate is not an authoritative gateway charge or settlement, even after completion.
    Fault:
      type: object
      additionalProperties: false
      required: [code, severity, latched, occurred_at]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [warning, stop, lockout]
        latched:
          type: boolean
        occurred_at:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
